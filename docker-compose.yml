services:
  postgres:
    image: postgres:16-alpine
    container_name: craftflow-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: craftflow_dev
      TZ: Europe/Kyiv
    ports:
      - "5432:5432"
    volumes:
      - craftflow_pgdata:/var/lib/postgresql/data

volumes:
  craftflow_pgdata:
    external: true